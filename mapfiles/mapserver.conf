#
# Config MapServer du noeud Rudi - un seul mapfile, un seul alias.
#
# MS_MAPFILE : mapfile par defaut quand aucun "map=" n'est fourni -- un seul
# mapfile existe ici, donc WMS/WFS classiques n'ont jamais besoin de "?map=
# RUDI&" (voir KNOWN_ISSUES.md point 9 : un client qui concatene betement
# ses propres parametres a la suite d'une URL de catalogue qui contient deja
# un "?...&REQUEST=GetCapabilities" produit une URL a deux "?", invalide).
#
# MAPS "RUDI" : alias utilise par OGC API Features, qui route par CHEMIN et
# non par parametre (RFC ms-rfc-134, voir KNOWN_ISSUES.md point 1) :
# /RUDI/ogcapi/<route>. Les deux mecanismes coexistent sans conflit : l'un
# s'active sur PATH_INFO, l'autre en son absence.
#
CONFIG
  ENV
    MS_MAP_NO_PATH "1"
    MS_MAPFILE "/etc/mapserver/generated/rudi.map"
    MS_ERRORFILE "stderr"
  END

  MAPS
    RUDI "/etc/mapserver/generated/rudi.map"
  END
END
