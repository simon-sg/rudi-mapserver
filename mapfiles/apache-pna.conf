# Private Network Access (Chrome) : une page publique en HTTPS qui appelle ce
# service en HTTP/local doit recevoir ce header sur le preflight OPTIONS pour
# que Chrome autorise la requete. CORS de base (Access-Control-Allow-Origin)
# est deja gere par le conf MapServer d'origine.
<LocationMatch "^/.*">
  Header set Access-Control-Allow-Private-Network "true"
</LocationMatch>
