# Terminaison TLS locale (certificat mkcert, confiance uniquement sur cette
# machine) devant MapServer, pour que le navigateur ne bloque pas les tuiles
# WMS en mixed-content quand MapStore est charge en HTTPS.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/localhost.pem;
    ssl_certificate_key /etc/nginx/tls/localhost-key.pem;

    location / {
        proxy_pass http://mapserver:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
